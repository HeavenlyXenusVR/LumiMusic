name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag, e.g. v0.7.0. Run the workflow on the branch or tag to build;
          a tag that does not exist yet is created on that commit when publishing.
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The `secrets` context can't be read from a step-level `if`, so the
      # "do we have a keystore" decision is hoisted into a plain env value.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      # A manual run builds the commit it was started on, so a release can be cut
      # from a branch before its tag exists; a tag push builds the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check the tag matches the app version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        # Release signing is opt-in: without the secrets the build still produces
        # an unsigned APK rather than failing, which is better than a green run
        # that silently attaches nothing.
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble release
        env:
          LUMI_BRIDGE_API_KEY: ${{ secrets.LUMI_BRIDGE_API_KEY }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Checksums
        run: |
          find app/build/outputs -name '*.apk' -o -name '*.aab' | while read -r f; do
            sha256sum "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            checksums.txt
