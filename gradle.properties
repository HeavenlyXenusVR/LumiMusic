org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# KSP registers its generated sources through the kotlin.sourceSets DSL, which
# AGP 9's built-in Kotlin rejects by default. This is AGP's own documented escape
# hatch for exactly that combination -- Room's generated code is the only thing
# it affects here.
android.disallowKotlinSourceSets=false
